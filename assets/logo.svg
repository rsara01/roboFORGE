<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-label="RoboForge logo">
  <defs>
    <linearGradient id="armGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8c6d4"/>
      <stop offset="1" stop-color="#7c8a98"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a4b3"/>
      <stop offset="1" stop-color="#5d6c7a"/>
    </linearGradient>
    <radialGradient id="orangeGrad" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffb058"/>
      <stop offset="1" stop-color="#f08327"/>
    </radialGradient>
  </defs>

  <!-- spiked sun-burst shape behind the arm (10-point star, slightly rough) -->
  <g transform="translate(170 160)">
    <path fill="url(#orangeGrad)" d="
      M 0 -120
      L 22 -78  L 64 -90  L 56 -50
      L 102 -38  L 78 -8   L 118 18
      L 78 36   L 102 78  L 56 70
      L 64 110  L 22 100  L 0 138
      L -22 100 L -64 110 L -56 70
      L -102 78 L -78 36  L -118 18
      L -78 -8  L -102 -38 L -56 -50
      L -64 -90 L -22 -78 Z"/>
  </g>

  <!-- shoulder pivot -->
  <circle cx="170" cy="240" r="34" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3"/>
  <circle cx="170" cy="240" r="14" fill="#f08327"/>

  <!-- upper arm segment -->
  <rect x="155" y="155" width="38" height="100" rx="14" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3" transform="rotate(-18 174 200)"/>

  <!-- elbow joint -->
  <circle cx="240" cy="135" r="22" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3"/>
  <circle cx="240" cy="135" r="8" fill="#f08327"/>

  <!-- forearm segment -->
  <rect x="232" y="120" width="120" height="32" rx="12" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3"/>

  <!-- wrist joint -->
  <circle cx="346" cy="135" r="18" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3"/>

  <!-- gripper body -->
  <rect x="332" y="148" width="40" height="40" rx="4" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3"/>

  <!-- gripper claws -->
  <path d="M 332 188 L 322 218 L 332 222 Z" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 372 188 L 382 218 L 372 222 Z" fill="url(#armGrad)" stroke="#4d5965" stroke-width="3" stroke-linejoin="round"/>

  <!-- base trapezoid -->
  <path d="M 110 280 L 230 280 L 215 320 L 125 320 Z"
        fill="url(#baseGrad)" stroke="#4d5965" stroke-width="3" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="240" y="370" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="46" font-weight="800" letter-spacing="2"
        fill="#5d6c7a">ROBOFORGE</text>
</svg>
